name: Changesets - Publish
description: Publish packages to npm
runs:
  using: node24
  main: ../dist/publish.js
inputs:
  gitea-token:
    description: >
      The Gitea token to use for authentication. Defaults to the token provided by Gitea Actions.
      To use a custom token, pass it explicitly to this input.
    required: false
    default: ${{ gitea.token }}
  script:
    description: "The command to use to publish packages"
    required: false
  pack-dir-artifact-id:
    description: "Artifact id for packed publish output generated by the pack subaction"
    required: false
  create-gitea-releases:
    description: "Whether to create Gitea releases after publish"
    required: false
    default: true
  push-git-tags:
    description: >
      Whether to create git tags after publish. If `create-gitea-releases` is set to `true`,
      this option will also always be `true`.
    required: false
    default: true
  cwd:
    description: "The working directory to execute Changesets in. Defaults to the root of the repository."
    required: false
outputs:
  published:
    description: A "true" or "false" string value to indicate whether a publishing has happened or not
  published-packages:
    description: >
      A JSON array to present the published packages. The format is `[{"name": "@xx/xx", "version": "1.2.0"}, {"name": "@xx/xy", "version": "0.8.9"}]`
branding:
  icon: package
  color: blue
